[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-alignment-text-toy"
version = "0.1.0"
description = "A deterministic text-only bounded-horizon intent-alignment environment."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Lirui Luo"}]
dependencies = []

[project.optional-dependencies]
eval = ["torch", "transformers>=5.5.0", "accelerate"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
